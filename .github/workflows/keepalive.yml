# Supabase Free pausiert Projekte nach 7 Tagen ohne Aktivität. Ein täglicher Aufruf hält es wach.
# Secrets im GitHub-Repo anlegen: SUPABASE_URL, SUPABASE_ANON_KEY
name: Supabase wach halten
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
