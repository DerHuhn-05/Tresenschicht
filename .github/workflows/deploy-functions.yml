# Veröffentlicht die Supabase Edge Function „pub-review“ (Vorschläge per E-Mail prüfen).
# Secrets: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens), VITE_SUPABASE_URL (schon vorhanden),
#          RESEND_API_KEY (resend.com → API Keys), optional MAIL_FROM (Absender mit eigener Domain)
name: Supabase-Funktion veröffentlichen
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Projekt aus der Supabase-URL ablesen
        id: ref
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: echo "ref=$(echo "$URL" | sed -E 's#https?://([^.]+)\..*#\1#')" >> "$GITHUB_OUTPUT"
      - name: Secrets setzen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          args=("RESEND_API_KEY=$RESEND_API_KEY" "ADMIN_EMAIL=tresenschicht@gmx.net" "APP_URL=https://derhuhn-05.github.io/Tresenschicht/")
          if [ -n "$MAIL_FROM" ]; then args+=("MAIL_FROM=$MAIL_FROM"); fi
          supabase secrets set "${args[@]}" --project-ref "${{ steps.ref.outputs.ref }}"
      - name: Funktion veröffentlichen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # ohne JWT-Prüfung: die Prüfseite aus der E-Mail ist nicht angemeldet; die Funktion prüft selbst
        run: supabase functions deploy pub-review --project-ref "${{ steps.ref.outputs.ref }}" --no-verify-jwt
