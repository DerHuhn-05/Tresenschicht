    <title>Tresenschicht</title>
    <script>
      // Hell oder Dunkel folgt der iPhone-Einstellung. Wer „Kontrast erhöhen“ eingestellt hat, bekommt den Hochkontrast-Modus.
      if (matchMedia('(prefers-contrast: more)').matches) document.documentElement.dataset.theme = 'contrast';
    </script>
    <!-- Ladebildschirm: steht sofort, bevor CSS und JavaScript geladen sind; React ersetzt ihn -->
    <style>
      html, body { margin: 0; height: 100%; background: #000035; }
      .splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000035; }
      .splash svg { animation: splash-in 400ms ease-out both; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.92); } }
      @media (prefers-reduced-motion: reduce) { .splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="img" aria-label="Tresenschicht wird geladen"><svg width="112" height="112" viewBox="0 0 24 24" fill="none" stroke="#F5A31A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5 5 4.5h14l1.5 5a2.83 2.83 0 0 1-5.67 0 2.83 2.83 0 0 1-5.66 0 2.83 2.83 0 0 1-5.67 0Z" fill="#F5A31A"/><path d="M5 12.5v7h14v-7"/><path d="M10 19.5v-3.5a2 2 0 0 1 4 0v3.5"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
