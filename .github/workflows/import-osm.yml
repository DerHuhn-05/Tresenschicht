# Lädt Ländergrenzen (Natural Earth) und Kneipen, Bars, Biergärten (OpenStreetMap über Geofabrik)
# in die Supabase-Datenbank. Start: Actions → „Kneipen importieren“ → Run workflow.
# Braucht die Secrets VITE_SUPABASE_URL und SUPABASE_SERVICE_ROLE_KEY sowie einmalig
# supabase/import-functions.sql im SQL-Editor.
name: Kneipen importieren
on:
  workflow_dispatch:
    inputs:
      regionen:
        description: 'Geofabrik-Regionen (Europa), durch Leerzeichen getrennt. Zum Testen z. B. nur: germany'
        default: 'germany austria switzerland france belgium netherlands luxembourg denmark poland czech-republic'
        required: true
  schedule:
    - cron: '23 3 1 * *' # am 1. jedes Monats aktualisieren
concurrency: import-osm
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REGIONEN: ${{ inputs.regionen || 'germany austria switzerland france belgium netherlands luxembourg denmark poland czech-republic' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Werkzeuge installieren
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Verbindung prüfen
        run: node scripts/import-supabase.mjs check
      - name: Ländergrenzen laden
        run: |
          curl -fsSL -o ne.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson \
            || curl -fsSL -o ne.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson
          node scripts/import-supabase.mjs countries ne.geojson
      - name: Kneipen aus OpenStreetMap filtern
        run: |
          : > pubs.geojsonseq
          for r in $REGIONEN; do
            echo "::group::$r"
            curl -fsSL --retry 3 -o region.osm.pbf "https://download.geofabrik.de/europe/$r-latest.osm.pbf"
            ls -lh region.osm.pbf
            osmium tags-filter region.osm.pbf nwr/amenity=pub,bar,biergarten -o filtered.osm.pbf --overwrite
            osmium export filtered.osm.pbf -f geojsonseq --add-unique-id=type_id --geometry-types=point,polygon -o region.geojsonseq --overwrite
            echo "$(wc -l < region.geojsonseq) Orte in $r"
            cat region.geojsonseq >> pubs.geojsonseq
            rm -f region.osm.pbf filtered.osm.pbf region.geojsonseq
            echo "::endgroup::"
          done
      - name: In die Datenbank schreiben
        run: node scripts/import-supabase.mjs pubs pubs.geojsonseq
